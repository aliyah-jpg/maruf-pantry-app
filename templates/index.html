<!DOCTYPE html>
<html lang="en" class="theme-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma'ruf Dallas Ops Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .theme-dark {
            --bg-main: #063244;
            --bg-surface: #042431;
            --bg-card: #083c52;
            --text-main: #f3e6d1;
            --text-muted: #cbd5e1;
            --border-color: #0b4a64;
            --maruf-blue: #267796;
            --maruf-gold: #b87704;
        }

        .theme-light {
            --bg-main: #f3e6d1;
            --bg-surface: #fbf7f0;
            --bg-card: #ffffff;
            --text-main: #063244;
            --text-muted: #475569;
            --border-color: #d1c1a5;
            --maruf-blue: #267796;
            --maruf-gold: #b87704;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .bg-surface { background-color: var(--bg-surface); }
        .bg-card { background-color: var(--bg-card); }
        .border-theme { border-color: var(--border-color); }
        .text-theme { color: var(--text-main); }
        .text-muted { color: var(--text-muted); }

        .bg-maruf-blue { background-color: #267796; }
        .bg-maruf-gold { background-color: #b87704; }
        .text-maruf-gold { color: #b87704; }
        .text-maruf-blue { color: #267796; }

        .modal-backdrop { background-color: rgba(4, 36, 49, 0.85); backdrop-filter: blur(2px); }
        .suggestions-dropdown {
            max-height: 220px;
            overflow-y: auto;
            position: absolute;
            z-index: 70;
            width: 100%;
            top: 100%;
            left: 0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-surface border-b border-theme sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between min-h-[96px] py-2">
                <div class="flex items-center space-x-4">
                    <img src="{{ url_for('static', filename='logo.png') }}" alt="Ma'ruf Dallas Logo" class="h-[88px] w-auto object-contain py-1">
                    <div class="border-l border-theme pl-4">
                        <div class="flex items-center space-x-2">
                            <h1 class="text-xl font-bold uppercase tracking-wide text-theme">Ma'ruf Dallas</h1>
                            <span class="text-xs font-semibold px-2 py-0.5 bg-maruf-blue text-white uppercase">Ops Hub</span>
                        </div>
                        <p class="text-xs text-muted mt-0.5">9319 Lyndon B Johnson Fwy Suite 110, Dallas TX</p>
                    </div>
                </div>

                <div class="flex items-center space-x-4 sm:space-x-6">
                    <button onclick="toggleTheme()" id="theme-toggle-btn" class="flex items-center space-x-2 px-3 py-2 border border-theme text-xs font-bold uppercase tracking-wider text-theme hover:bg-maruf-blue hover:text-white transition rounded-none">
                        <i class="fa-solid fa-sun text-maruf-gold" id="theme-icon"></i>
                        <span id="theme-label">Light Theme</span>
                    </button>

                    <div class="flex items-center space-x-1 p-1 border border-theme rounded-none">
                        <button id="btn-ramadan" onclick="switchCampaign('ramadan')" class="flex items-center space-x-2 px-3 py-1.5 rounded-none text-xs font-bold uppercase tracking-wider bg-maruf-blue text-white">
                            <i class="fa-solid fa-moon text-maruf-gold"></i><span>Ramadan 1448</span>
                        </button>
                        <button id="btn-dhulhijjah" onclick="switchCampaign('dhulhijjah')" class="flex items-center space-x-2 px-3 py-1.5 rounded-none text-xs font-bold uppercase tracking-wider text-muted hover:text-theme">
                            <i class="fa-solid fa-kaaba text-maruf-gold"></i><span>Dhul Hijjah</span>
                        </button>
                    </div>

                    <div class="h-8 w-px border-r border-theme hidden sm:block"></div>

                    <button onclick="openModal('entry-modal')" class="bg-maruf-gold hover:bg-amber-600 text-white font-bold px-5 py-2.5 rounded-none text-xs uppercase tracking-wider flex items-center space-x-2 transition border border-maruf-gold shadow-md">
                        <i class="fa-solid fa-plus-circle"></i><span>Create Entry</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <div class="border-b border-theme">
            <nav class="flex space-x-1 overflow-x-auto pb-2">
                <button onclick="setActiveTab('dashboard')" id="tab-dashboard" class="nav-tab flex items-center space-x-2 px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-maruf-gold bg-surface border-t-2 border-maruf-gold whitespace-nowrap">
                    <i class="fa-solid fa-chart-line"></i><span>Main Dashboard</span>
                </button>
                <button onclick="setActiveTab('planning')" id="tab-planning" class="nav-tab flex items-center space-x-2 px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-muted hover:text-theme whitespace-nowrap">
                    <i class="fa-solid fa-clipboard-check"></i><span>Pre-Ramadan Planning</span>
                </button>
                <button onclick="setActiveTab('tasks')" id="tab-tasks" class="nav-tab flex items-center space-x-2 px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-muted hover:text-theme whitespace-nowrap">
                    <i class="fa-solid fa-list-check"></i><span>Staff Tasks</span>
                </button>
                <button onclick="setActiveTab('tabling')" id="tab-tabling" class="nav-tab flex items-center space-x-2 px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-muted hover:text-theme whitespace-nowrap">
                    <i class="fa-solid fa-mosque"></i><span>Tabling & Outreach</span>
                </button>
                <button onclick="setActiveTab('distributions')" id="tab-distributions" class="nav-tab flex items-center space-x-2 px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-muted hover:text-theme whitespace-nowrap">
                    <i class="fa-solid fa-truck-ramp-box"></i><span>Distributions & Inventory</span>
                </button>
                <button onclick="setActiveTab('collaborations')" id="tab-collaborations" class="nav-tab flex items-center space-x-2 px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-muted hover:text-theme whitespace-nowrap">
                    <i class="fa-solid fa-handshake"></i><span>Collaborations & Partners</span>
                </button>
                <button onclick="setActiveTab('dinners')" id="tab-dinners" class="nav-tab flex items-center space-x-2 px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-muted hover:text-theme whitespace-nowrap">
                    <i class="fa-solid fa-utensils"></i><span>Dinners & Events</span>
                </button>
                <button onclick="setActiveTab('marketing')" id="tab-marketing" class="nav-tab flex items-center space-x-2 px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-muted hover:text-theme whitespace-nowrap">
                    <i class="fa-solid fa-bullhorn"></i><span>Marketing Plans</span>
                </button>
                <button onclick="setActiveTab('volunteers')" id="tab-volunteers" class="nav-tab flex items-center space-x-2 px-4 py-2.5 text-xs font-bold uppercase tracking-wider text-muted hover:text-theme whitespace-nowrap">
                    <i class="fa-solid fa-user-gear"></i><span>Volunteers</span>
                </button>
            </nav>
        </div>

        <!-- Staff Toolbar -->
        <div id="staff-filter-toolbar" class="bg-surface border border-theme p-4 flex flex-col sm:flex-row items-center justify-between gap-4 hidden">
            <div>
                <h3 class="font-bold text-theme text-xs uppercase tracking-wider">Staff Deliverables View</h3>
                <p class="text-xs text-muted">Filter sub-tasks assigned across staff members</p>
            </div>
            <div class="flex items-center space-x-3">
                <label class="text-xs font-bold text-theme uppercase">Filter by Staff Member:</label>
                <select id="staff-select-filter" onchange="renderUI()" class="bg-card border border-maruf-blue px-3 py-2 text-xs text-theme focus:outline-none">
                    <option value="ALL">All Staff Members</option>
                    <option value="Fuad">Fuad</option>
                    <option value="Aisha">Aisha</option>
                    <option value="Abdi">Abdi</option>
                    <option value="Walid">Walid</option>
                    <option value="Mahek">Mahek</option>
                    <option value="Muntaha">Muntaha</option>
                    <option value="AjiFanta">AjiFanta</option>
                    <option value="Aliyah">Aliyah</option>
                    <option value="Raheeq">Raheeq</option>
                    <option value="Marwa">Marwa</option>
                    <option value="Hikmatullah">Hikmatullah</option>
                </select>
            </div>
        </div>

        <div id="main-display" class="space-y-6"></div>

    </main>

    <!-- Modal: Edit Metrics -->
    <div id="metrics-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden p-4 modal-backdrop">
        <div class="bg-surface border border-maruf-gold w-full max-w-md p-6 space-y-4 rounded-none shadow-2xl">
            <div class="flex justify-between items-center border-b border-theme pb-3">
                <h3 class="text-sm font-bold text-theme uppercase tracking-wider"><i class="fa-solid fa-sliders text-maruf-gold mr-2"></i>Update Campaign Metrics</h3>
                <button onclick="closeModal('metrics-modal')" class="text-muted hover:text-theme"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <form onsubmit="handleMetricsSubmit(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Total Funds Raised ($)</label>
                    <input type="number" id="metric-raised" required class="w-full bg-card border border-theme p-2.5 text-theme">
                </div>
                <div>
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Campaign Goal ($)</label>
                    <input type="number" id="metric-goal" required class="w-full bg-card border border-theme p-2.5 text-theme">
                </div>
                <div>
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Food Packages / Boxes</label>
                    <input type="number" id="metric-food-boxes" required class="w-full bg-card border border-theme p-2.5 text-theme">
                </div>
                <div>
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Total Meals Served</label>
                    <input type="number" id="metric-meals-served" required class="w-full bg-card border border-theme p-2.5 text-theme">
                </div>
                <div>
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Active Volunteers Count</label>
                    <input type="number" id="metric-volunteers" required class="w-full bg-card border border-theme p-2.5 text-theme">
                </div>
                <div class="flex justify-end space-x-3 pt-3 border-t border-theme">
                    <button type="button" onclick="closeModal('metrics-modal')" class="px-4 py-2 text-muted bg-card border border-theme uppercase font-bold text-xs">Cancel</button>
                    <button type="submit" class="px-5 py-2 uppercase font-bold text-xs bg-maruf-gold text-white border border-maruf-gold">Save Metrics</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Create Entry -->
    <div id="entry-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden p-4 modal-backdrop">
        <div class="bg-surface border border-maruf-blue w-full max-w-lg p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-theme pb-3">
                <h3 class="text-sm font-bold text-theme uppercase tracking-wider"><i class="fa-solid fa-pen-to-square text-maruf-gold mr-2"></i>Create New Activity Entry</h3>
                <button onclick="closeModal('entry-modal')" class="text-muted hover:text-theme"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <form onsubmit="handleEntrySubmit(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Operational Section</label>
                    <select id="entry-section" required class="w-full bg-card border border-theme p-2.5 text-theme">
                        <option value="tabling">Tabling & Outreach</option>
                        <option value="distributions">Distributions & Inventory</option>
                        <option value="collaborations">Collaborations & Partners</option>
                        <option value="dinners">Dinners & Events</option>
                        <option value="marketing">Marketing Plans</option>
                        <option value="volunteers">Volunteers</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Entry Title</label>
                    <input type="text" id="entry-title" required placeholder="e.g. VRIC Jummah Drive" class="w-full bg-card border border-theme p-2.5 text-theme">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-theme uppercase mb-1">Created By</label>
                        <select id="entry-creator" required class="w-full bg-card border border-theme p-2.5 text-theme">
                            <option>Fuad</option><option>Aisha</option><option>Abdi</option>
                            <option>Walid</option><option>Mahek</option><option>Muntaha</option>
                            <option>AjiFanta</option><option>Aliyah</option><option>Raheeq</option>
                            <option>Marwa</option><option>Hikmatullah</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-theme uppercase mb-1">Event / Target Date</label>
                        <input type="date" id="entry-date" required class="w-full bg-card border border-theme p-2.5 text-theme">
                    </div>
                </div>

                <div class="relative">
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Location / Hub Address</label>
                    <input type="text" id="entry-location" oninput="handleLocationTyping(this.value)" autocomplete="off" placeholder="Type LBJ Freeway, masjid name or address..." class="w-full bg-card border border-theme p-2.5 text-theme focus:border-maruf-gold focus:outline-none">
                    <div id="location-suggestions" class="suggestions-dropdown hidden bg-surface border border-maruf-blue shadow-2xl text-xs divide-y divide-theme"></div>
                </div>

                <div class="grid grid-cols-2 gap-3 bg-card p-3 border border-theme">
                    <div>
                        <label class="block text-[11px] font-bold text-maruf-gold uppercase mb-1">Collected Revenue ($)</label>
                        <input type="number" id="entry-funds" placeholder="0.00" class="w-full bg-surface border border-theme p-2 text-theme">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-maruf-blue uppercase mb-1">Swift-Give Campaign Tag</label>
                        <input type="text" id="entry-swift-tag" placeholder="e.g. VRIC-RAMADAN-2027" class="w-full bg-surface border border-theme p-2 text-theme">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Notes / Instructions</label>
                    <textarea id="entry-notes" rows="2" placeholder="General entry guidelines or contacts..." class="w-full bg-card border border-theme p-2.5 text-theme"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-3 border-t border-theme">
                    <button type="button" onclick="closeModal('entry-modal')" class="px-4 py-2 text-muted bg-card border border-theme uppercase font-bold text-xs">Cancel</button>
                    <button type="submit" class="px-5 py-2 uppercase font-bold text-xs bg-maruf-gold text-white border border-maruf-gold">Save Entry</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Edit Entry -->
    <div id="edit-entry-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden p-4 modal-backdrop">
        <div class="bg-surface border border-maruf-gold w-full max-w-lg p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-theme pb-3">
                <h3 class="text-sm font-bold text-theme uppercase tracking-wider"><i class="fa-solid fa-pen-to-square text-maruf-gold mr-2"></i>Edit Activity Entry</h3>
                <button onclick="closeModal('edit-entry-modal')" class="text-muted hover:text-theme"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <form onsubmit="handleEntryEditSubmit(event)" class="space-y-3 text-xs">
                <input type="hidden" id="edit-entry-id">
                
                <div>
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Entry Title</label>
                    <input type="text" id="edit-entry-title" required class="w-full bg-card border border-theme p-2.5 text-theme">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-theme uppercase mb-1">Created By</label>
                        <select id="edit-entry-creator" required class="w-full bg-card border border-theme p-2.5 text-theme">
                            <option>Fuad</option><option>Aisha</option><option>Abdi</option>
                            <option>Walid</option><option>Mahek</option><option>Muntaha</option>
                            <option>AjiFanta</option><option>Aliyah</option><option>Raheeq</option>
                            <option>Marwa</option><option>Hikmatullah</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-theme uppercase mb-1">Event / Target Date</label>
                        <input type="date" id="edit-entry-date" required class="w-full bg-card border border-theme p-2.5 text-theme">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Location / Hub Address</label>
                    <input type="text" id="edit-entry-location" class="w-full bg-card border border-theme p-2.5 text-theme">
                </div>

                <div class="grid grid-cols-2 gap-3 bg-card p-3 border border-theme">
                    <div>
                        <label class="block text-[11px] font-bold text-maruf-gold uppercase mb-1">Collected Revenue ($)</label>
                        <input type="number" id="edit-entry-funds" class="w-full bg-surface border border-theme p-2 text-theme">
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-maruf-blue uppercase mb-1">Swift-Give Campaign Tag</label>
                        <input type="text" id="edit-entry-swift-tag" class="w-full bg-surface border border-theme p-2 text-theme">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Notes / Instructions</label>
                    <textarea id="edit-entry-notes" rows="2" class="w-full bg-card border border-theme p-2.5 text-theme"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-3 border-t border-theme">
                    <button type="button" onclick="closeModal('edit-entry-modal')" class="px-4 py-2 text-muted bg-card border border-theme uppercase font-bold text-xs">Cancel</button>
                    <button type="submit" class="px-5 py-2 uppercase font-bold text-xs bg-maruf-gold text-white border border-maruf-gold">Update Entry</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Add Task -->
    <div id="task-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden p-4 modal-backdrop">
        <div class="bg-surface border border-maruf-blue w-full max-w-lg p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-theme pb-3">
                <h3 class="text-sm font-bold text-theme uppercase tracking-wider"><i class="fa-solid fa-list-check text-maruf-blue mr-2"></i>Add Sub-Task & Deadline</h3>
                <button onclick="closeModal('task-modal')" class="text-muted hover:text-theme"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>

            <form onsubmit="handleTaskSubmit(event)" class="space-y-3 text-xs">
                <input type="hidden" id="task-entry-id">
                <input type="hidden" id="task-entry-title">
                <input type="hidden" id="task-entry-section">

                <div>
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Task Deliverable</label>
                    <input type="text" id="task-name" required placeholder="e.g. Print banner and pack donation boxes" class="w-full bg-card border border-theme p-2.5 text-theme">
                </div>
                <div>
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Assigned Staff</label>
                    <select id="task-assignee" required class="w-full bg-card border border-theme p-2.5 text-theme">
                        <option>Fuad</option><option>Aisha</option><option>Abdi</option>
                        <option>Walid</option><option>Mahek</option><option>Muntaha</option>
                        <option>AjiFanta</option><option>Aliyah</option><option>Raheeq</option>
                        <option>Marwa</option><option>Hikmatullah</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-theme uppercase mb-1">Deadline Date</label>
                        <input type="date" id="task-due-date" required class="w-full bg-card border border-theme p-2.5 text-theme">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-theme uppercase mb-1">Deadline Time</label>
                        <input type="time" id="task-due-time" class="w-full bg-card border border-theme p-2.5 text-theme">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-theme uppercase mb-1">Task Details / Instructions</label>
                    <textarea id="task-details" rows="2" placeholder="Specific instructions for this staff member..." class="w-full bg-card border border-theme p-2.5 text-theme"></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-3 border-t border-theme">
                    <button type="button" onclick="closeModal('task-modal')" class="px-4 py-2 text-muted bg-card border border-theme uppercase font-bold text-xs">Cancel</button>
                    <button type="submit" class="px-5 py-2 font-bold text-xs uppercase bg-maruf-blue text-white border border-maruf-blue">Add Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentSeason = 'ramadan';
        let currentTab = 'dashboard';
        let store = { ramadan: { entries: [], tasks: [], planning: [], shopping: [], metrics: {} }, dhulhijjah: { entries: [], tasks: [], planning: [], shopping: [], metrics: {} } };
        let debounceTimer;

        const officialStaffList = ["Fuad", "Aisha", "Abdi", "Walid", "Mahek", "Muntaha", "AjiFanta", "Aliyah", "Raheeq", "Marwa", "Hikmatullah"];

        const dfwMasjids = [
            "Ma'ruf Dallas Office - 9319 Lyndon B Johnson Fwy Suite 110, Dallas, TX 75243",
            "Valley Ranch Islamic Center (VRIC), Irving, TX",
            "Islamic Association of North Texas (IANT), Richardson, TX",
            "Islamic Center of Irving (ICI), Irving, TX",
            "Dallas Jamma Masjid, Dallas, TX",
            "East Plano Islamic Center (EPIC), Plano, TX",
            "Islamic Association of Collin County (IACC), Plano, TX",
            "Frisco Masjid (ICF), Frisco, TX",
            "Islamic Center of Arlington, Arlington, TX"
        ];

        document.addEventListener('DOMContentLoaded', fetchStore);

        function toggleTheme() {
            const html = document.documentElement;
            const btnLabel = document.getElementById('theme-label');
            const btnIcon = document.getElementById('theme-icon');

            if (html.classList.contains('theme-dark')) {
                html.classList.remove('theme-dark');
                html.classList.add('theme-light');
                btnLabel.innerText = "Dark Theme";
                btnIcon.className = "fa-solid fa-moon text-maruf-blue";
            } else {
                html.classList.remove('theme-light');
                html.classList.add('theme-dark');
                btnLabel.innerText = "Light Theme";
                btnIcon.className = "fa-solid fa-sun text-maruf-gold";
            }
        }

        function fetchStore() {
            fetch('/api/data')
                .then(r => r.json())
                .then(data => { store = data; renderUI(); })
                .catch(err => console.error("Data load error:", err));
        }

        function switchCampaign(s) {
            currentSeason = s;
            document.getElementById('btn-ramadan').className = s === 'ramadan' ? 'flex items-center space-x-2 px-3 py-1.5 rounded-none text-xs font-bold uppercase tracking-wider bg-maruf-blue text-white' : 'flex items-center space-x-2 px-3 py-1.5 rounded-none text-xs font-bold uppercase tracking-wider text-muted hover:text-theme';
            document.getElementById('btn-dhulhijjah').className = s === 'dhulhijjah' ? 'flex items-center space-x-2 px-3 py-1.5 rounded-none text-xs font-bold uppercase tracking-wider bg-maruf-gold text-white' : 'flex items-center space-x-2 px-3 py-1.5 rounded-none text-xs font-bold uppercase tracking-wider text-muted hover:text-theme';
            renderUI();
        }

        function setActiveTab(t) {
            currentTab = t;
            document.querySelectorAll('.nav-tab').forEach(b => {
                b.className = 'nav-tab flex items-center space-x-2 px-4 py-2.5 text-xs font-bold uppercase tracking-wider rounded-none text-muted hover:text-theme whitespace-nowrap cursor-pointer';
            });
            const activeBtn = document.getElementById('tab-' + t);
            if (activeBtn) {
                activeBtn.className = 'nav-tab flex items-center space-x-2 px-4 py-2.5 text-xs font-bold uppercase tracking-wider rounded-none text-maruf-gold bg-surface border-t-2 border-maruf-gold whitespace-nowrap cursor-pointer';
            }
            
            if (t === 'tasks') {
                document.getElementById('staff-filter-toolbar').classList.remove('hidden');
            } else {
                document.getElementById('staff-filter-toolbar').classList.add('hidden');
            }
            renderUI();
        }

        function emailStaff(staffName, taskSubject) {
            const cleanName = staffName.split(' ')[0];
            const email = `${cleanName.toLowerCase()}@marufdallas.org`;
            const subject = encodeURIComponent(`[Ma'ruf Ops Hub] Action Item: ${taskSubject || 'Deliverable Notice'}`);
            const body = encodeURIComponent(`Assalamu Alaikum ${cleanName},\n\nThis is a notification regarding your assigned deliverable in the Ma'ruf Dallas Ops Hub:\n\nDeliverable: ${taskSubject || 'General Assignment'}\n\nPlease update your task progress in the app.\n\nBarakAllahu Feekum,\nMa'ruf Dallas Operations Team`);
            window.open(`mailto:${email}?subject=${subject}&body=${body}`, '_blank');
        }

        function renderUI() {
            const container = document.getElementById('main-display');
            if (!container) return;
            const data = store[currentSeason] || { entries: [], tasks: [], planning: [], shopping: [], metrics: {} };

            if (currentTab === 'dashboard') {
                renderMainDashboard(container, data);
            } else if (currentTab === 'planning') {
                renderPreRamadanPlanningTab(container, data.planning, data.shopping);
            } else if (currentTab === 'tasks') {
                renderStaffTasksTab(container, data.tasks);
            } else {
                renderCoreSectionTab(container, data.entries, data.tasks, currentTab);
            }
        }

        function openMetricsModal() {
            const m = (store[currentSeason] && store[currentSeason].metrics) || { raised: 185000, goal: 250000, foodBoxes: 2100, mealsServed: 5400, volunteersCount: 96 };
            document.getElementById('metric-raised').value = m.raised;
            document.getElementById('metric-goal').value = m.goal;
            document.getElementById('metric-food-boxes').value = m.foodBoxes;
            document.getElementById('metric-meals-served').value = m.mealsServed;
            document.getElementById('metric-volunteers').value = m.volunteersCount;
            openModal('metrics-modal');
        }

        function handleMetricsSubmit(e) {
            e.preventDefault();
            const payload = {
                season: currentSeason,
                raised: document.getElementById('metric-raised').value,
                goal: document.getElementById('metric-goal').value,
                foodBoxes: document.getElementById('metric-food-boxes').value,
                mealsServed: document.getElementById('metric-meals-served').value,

            };

            const selectedStaff = document.getElementById('staff-select-filter').value;
            const filteredTasks = tasks.filter(t => selectedStaff === 'ALL' || t.assignee.toLowerCase().includes(selectedStaff.toLowerCase()));

            if (filteredTasks.length === 0) {
                container.innerHTML = `<div class="bg-surface p-8 text-center text-muted border border-theme">No sub-tasks assigned for ${selectedStaff}.</div>`;
                return;
            }

            container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">` + filteredTasks.map(t => `
                <div class="bg-surface border border-theme p-4 space-y-3 shadow-md">
                    <div class="flex justify-between items-start border-b border-theme pb-2">
                        <span class="text-[10px] font-bold text-maruf-gold uppercase tracking-wider">${t.section}</span>
                        <select onchange="updateTaskStatus('${t.id}', this.value)" class="text-xs bg-card border border-maruf-blue px-2 py-1 ${t.status === 'Completed' ? 'text-maruf-blue font-bold' : 'text-maruf-gold'}">
                            <option value="Pending" ${t.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="In Progress" ${t.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                            <option value="Completed" ${t.status === 'Completed' ? 'selected' : ''}>Completed</option>

                                <p class="text-muted">Assigned: <span class="text-maruf-blue font-semibold">${t.assignee}</span></p>

        function openEditEntryModal(id) {
            const entries = store[currentSeason].entries;
            const entry = entries.find(e => e.id === id);
            if (!entry) return;

            document.getElementById('edit-entry-id').value = entry.id;
            document.getElementById('edit-entry-title').value = entry.title;
            document.getElementById('edit-entry-creator').value = entry.creator;
            document.getElementById('edit-entry-date').value = entry.date;
            document.getElementById('edit-entry-location').value = entry.location || '';
            document.getElementById('edit-entry-funds').value = entry.funds || 0;
            document.getElementById('edit-entry-swift-tag').value = entry.swift_tag || '';
            document.getElementById('edit-entry-notes').value = entry.notes || '';

            openModal('edit-entry-modal');
        }

        function handleEntryEditSubmit(e) {
            e.preventDefault();
            const payload = {
                season: currentSeason,
                id: document.getElementById('edit-entry-id').value,
                title: document.getElementById('edit-entry-title').value,
                creator: document.getElementById('edit-entry-creator').value,
                date: document.getElementById('edit-entry-date').value,
                location: document.getElementById('edit-entry-location').value,
                funds: document.getElementById('edit-entry-funds').value || 0,
                swift_tag: document.getElementById('edit-entry-swift-tag').value || '',
                notes: document.getElementById('edit-entry-notes').value
            };

            fetch('/api/entries/edit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(r => r.json()).then(res => {
                store = res.data;
                closeModal('edit-entry-modal');
                renderUI();
            });
        }

        function handleLocationTyping(query) {
            clearTimeout(debounceTimer);
            const box = document.getElementById('location-suggestions');
            if (!query || query.trim().length < 2) {
                box.classList.add('hidden');
                return;
            }

            const q = query.toLowerCase();
            const localMatches = dfwMasjids.filter(m => m.toLowerCase().includes(q));

            debounceTimer = setTimeout(() => {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + " Texas")}&limit=5`;
                
                fetch(url)
                    .then(r => r.json())
                    .then(apiResults => {
                        let combined = [...localMatches.map(m => ({ title: m, subtitle: "Preset Hub / Venue" }))];
                        if (apiResults && apiResults.length > 0) {
                            apiResults.forEach(item => {
                                const clean = item.display_name;
                                if (!combined.some(c => c.title === clean)) combined.push({ title: clean, subtitle: "Address match" });
                            });
                        }
                        if (combined.length === 0) { box.classList.add('hidden'); return; }

                        box.innerHTML = combined.slice(0, 6).map(res => `
                            <div onclick="selectLocation('${res.title.replace(/'/g, "\\'")}')" class="p-3 hover:bg-maruf-blue hover:text-white cursor-pointer text-theme border-b border-theme transition">
                                <div class="font-semibold text-xs flex items-center uppercase tracking-wide"><i class="fa-solid fa-location-dot text-maruf-gold mr-2"></i>${res.title}</div>
                                <div class="text-[10px] text-muted pl-5 mt-0.5">${res.subtitle}</div>
                            </div>
                        `).join('');
                        box.classList.remove('hidden');
                    })
                    .catch(() => {
                        if (localMatches.length > 0) {
                            box.innerHTML = localMatches.map(m => `<div onclick="selectLocation('${m.replace(/'/g, "\\'")}')" class="p-3 hover:bg-maruf-blue hover:text-white cursor-pointer text-theme transition"><div class="font-semibold text-xs flex items-center uppercase tracking-wide"><i class="fa-solid fa-location-dot text-maruf-gold mr-2"></i>${m}</div></div>`).join('');
                            box.classList.remove('hidden');
                        } else { box.classList.add('hidden'); }
                    });
            }, 150);
        }

        function selectLocation(val) {
            document.getElementById('entry-location').value = val;
            document.getElementById('location-suggestions').classList.add('hidden');
        }

        function handleEntrySubmit(e) {
            e.preventDefault();
            const payload = {
                season: currentSeason,
                section: document.getElementById('entry-section').value,
                title: document.getElementById('entry-title').value,
                creator: document.getElementById('entry-creator').value,
                date: document.getElementById('entry-date').value,
                location: document.getElementById('entry-location').value,
                funds: document.getElementById('entry-funds').value || 0,
                swift_tag: document.getElementById('entry-swift-tag').value || '',
                notes: document.getElementById('entry-notes').value
            };

            fetch('/api/entries', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(r => r.json()).then(res => {
                store = res.data;
                closeModal('entry-modal');
                renderUI();
            });
        }

        function openAddTaskModal(entryId, title, section) {
            document.getElementById('task-entry-id').value = entryId;
            document.getElementById('task-entry-title').value = title;
            document.getElementById('task-entry-section').value = section;
            openModal('task-modal');
        }

        function handleTaskSubmit(e) {
            e.preventDefault();
            const payload = {
                season: currentSeason,
                entry_id: document.getElementById('task-entry-id').value,
                entry_title: document.getElementById('task-entry-title').value,
                section: document.getElementById('task-entry-section').value,
                task_name: document.getElementById('task-name').value,
                assignee: document.getElementById('task-assignee').value,

            };

            fetch('/api/tasks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).then(r => r.json()).then(res => {
                store = res.data;
                closeModal('task-modal');
                renderUI();
            });
        }

        function updateTaskStatus(taskId, status) {
            fetch('/api/tasks/status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ season: currentSeason, task_id: taskId, status: status })
            }).then(r => r.json()).then(res => {
                store = res.data;
                renderUI();
            });
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    // Function to send note to Flask backend and dispatch email
async function publishNote(staffName, taskTitle, taskId) {
  const noteInput = document.getElementById(`note-input-${taskId}`);
  const noteText = noteInput ? noteInput.value.trim() : '';

  if (!noteText) {
    alert("Please enter a note before publishing.");
    return;
  }

  try {
    const response = await fetch('/api/add-note', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        staffName: staffName,
        taskTitle: taskTitle,
        note: noteText
      })
    });

    const result = await response.json();
    if (response.ok) {
      alert(`Note published! An email has been sent to ${staffName}.`);
      noteInput.value = ''; // clear input box
    } else {
      alert(`Notice: ${result.message}`);
    }
  } catch (error) {
    console.error("Failed to publish note:", error);
    alert("Server error when attempting to publish note.");
  }
}</script>
